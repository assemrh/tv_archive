# Production stack for tv_archive (Frappe v16), based on frappe_docker pwd.yml.
#
#   cp docker/.env.example docker/.env      # then set the passwords
#   docker compose -f docker/compose.yaml --env-file docker/.env up -d
#
# The first start creates the site and installs tv_archive (service: create-site).

x-app: &app
  image: ${ARCHIVE_IMAGE:-tv-archive}:${ARCHIVE_TAG:-1.0.0}
  pull_policy: never
  restart: unless-stopped
  networks: [archive]
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs

x-after-config: &after-config
  depends_on:
    configurator:
      condition: service_completed_successfully

name: tv-archive

services:
  configurator:
    <<: *app
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host db;
        bench set-config -gp db_port 3306;
        bench set-config -g redis_cache "redis://redis-cache:6379";
        bench set-config -g redis_queue "redis://redis-queue:6379";
        bench set-config -g redis_socketio "redis://redis-queue:6379";
        bench set-config -gp socketio_port 9000;
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

  create-site:
    <<: [*app, *after-config]
    restart: "no"
    entrypoint: ["bash", "-c"]
    environment:
      SITE_NAME: ${SITE_NAME:?set SITE_NAME in docker/.env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in docker/.env}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in docker/.env}
    command:
      - |
        set -e
        wait-for-it -t 120 db:3306
        if [ -d "sites/$$SITE_NAME" ]; then
          echo "Site $$SITE_NAME exists, running migrate"
          bench --site "$$SITE_NAME" migrate
        else
          bench new-site "$$SITE_NAME" \
            --mariadb-user-host-login-scope='%' \
            --db-root-username=root \
            --db-root-password="$$DB_ROOT_PASSWORD" \
            --admin-password="$$ADMIN_PASSWORD" \
            --install-app tv_archive \
            --set-default
        fi

  backend:
    <<: [*app, *after-config]
    environment:
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}

  websocket:
    <<: [*app, *after-config]
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]

  queue-short:
    <<: [*app, *after-config]
    command: ["bench", "worker", "--queue", "short,default"]

  queue-long:
    <<: [*app, *after-config]
    command: ["bench", "worker", "--queue", "long,default,short"]

  scheduler:
    <<: [*app, *after-config]
    command: ["bench", "schedule"]

  frontend:
    <<: *app
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      - backend
      - websocket

  db:
    image: mariadb:11.8
    restart: unless-stopped
    networks: [archive]
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db-data:/var/lib/mysql

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [archive]

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [archive]
    volumes:
      - redis-queue-data:/data

volumes:
  db-data:
  redis-queue-data:
  sites:
  logs:

networks:
  archive:
